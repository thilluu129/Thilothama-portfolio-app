# Netlify configuration for V THILOTHAMA Portfolio Frontend

[build]
  # No build step needed — just static HTML/CSS/JS
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
